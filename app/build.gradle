plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load version properties once and cache them
def versionProps = new Properties()
def versionFile = file("version.properties")
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}

// Auto-incrementing version system
def getVersionCode() {
    def code = (versionProps['VERSION_CODE'] ?: '20').toInteger() + 1
    versionProps['VERSION_CODE'] = code.toString()

    // Save all properties (not just VERSION_CODE) to preserve VERSION_MAJOR, VERSION_MINOR, VERSION_PATCH
    versionFile.withOutputStream { stream ->
        versionProps.store(stream, "Auto-generated version info")
    }

    return code
}

def getVersionName() {
    def major = versionProps['VERSION_MAJOR'] ?: '2'
    def minor = versionProps['VERSION_MINOR'] ?: '0'
    def patch = versionProps['VERSION_PATCH'] ?: '0'
    def code = versionProps['VERSION_CODE'] ?: '20'

    return "${major}.${minor}.${patch}-build.${code}"
}

android {
    namespace 'com.customcamera.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.customcamera.app"
        minSdk 24
        targetSdk 35
        versionCode 42
        versionName "2.4.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Add build timestamp to BuildConfig
        buildConfigField "long", "BUILD_TIMESTAMP", System.currentTimeMillis() + "L"
        buildConfigField "String", "BUILD_DATE", "\"" + new Date().format("yyyy-MM-dd HH:mm") + "\""
        buildConfigField "String", "VERSION_NAME_FULL", "\"2.3.2-build.40\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    
    // CameraX dependencies
    // Upgraded to 1.5.0 (AGP 8.6.0+ required, now using AGP 8.6.0)
    implementation 'androidx.camera:camera-core:1.5.0'
    implementation 'androidx.camera:camera-camera2:1.5.0'
    implementation 'androidx.camera:camera-lifecycle:1.5.0'
    implementation 'androidx.camera:camera-view:1.5.0'
    implementation 'androidx.camera:camera-video:1.5.0'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // ML Kit for barcode scanning, object detection, and image labeling (latest stable 2025)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:object-detection:17.0.2'
    implementation 'com.google.mlkit:image-labeling:17.0.9'

    // Kotlin coroutines support for Google Play Services Tasks
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test:core-ktx:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'

    // UI Testing
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'

    // Memory Leak Detection
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'
}