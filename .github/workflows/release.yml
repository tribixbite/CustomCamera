name: Release bundle

# Builds a Play-ready, upload-key-signed AAB when a version tag is pushed
# (or on demand). Upload the artifact to Play Console manually.
#
# Required repository secrets:
#   CC_UPLOAD_KEYSTORE_B64  base64 of the upload keystore (.jks)
#   CC_KEYSTORE_PASSWORD    keystore password
#   CC_KEY_ALIAS            key alias
#   CC_KEY_PASSWORD         key password
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.CC_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::CC_UPLOAD_KEYSTORE_B64 secret is not set"; exit 1
          fi
          mkdir -p release
          echo "$KEYSTORE_B64" | base64 -d > release/upload.jks

      - name: Test, lint and build signed bundle
        env:
          CC_KEYSTORE_PATH: release/upload.jks
          CC_KEYSTORE_PASSWORD: ${{ secrets.CC_KEYSTORE_PASSWORD }}
          CC_KEY_ALIAS: ${{ secrets.CC_KEY_ALIAS }}
          CC_KEY_PASSWORD: ${{ secrets.CC_KEY_PASSWORD }}
        run: ./gradlew --stacktrace -PrequireReleaseSigning :app:testDebugUnitTest :app:lintRelease :app:bundleRelease

      - name: Verify bundle signature
        run: |
          jarsigner -verify -verbose:summary app/build/outputs/bundle/release/app-release.aab | tail -3
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | head -8

      - name: Remove keystore
        if: always()
        run: rm -f release/upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: customcamera-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
